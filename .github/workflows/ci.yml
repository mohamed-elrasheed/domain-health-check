name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"  # Mondays, so a vulnerability published after the last push still shows up

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      # A skipped test fails here: every skip means the browser or Pango is missing, and those are the
      # tests that prove the report shows what a visitor sees and that the PDF holds every finding.
      DHC_NO_SKIPS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install Pango and HarfBuzz subsetting for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install the package at the pinned versions
        run: python -m pip install -c requirements.lock -e ".[dev,sweep,ai]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  audit:
    # pip-audit (from the Python Packaging Authority) checks every pinned package against the public
    # vulnerability databases. A known vulnerability in requirements.lock fails the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit the pinned packages
        run: pip-audit -r requirements.lock --progress-spinner off
