<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>${display_name} | ${trade} in ${town}</title>
<style>
  :root {
    --ink: #1d2a1f;
    --muted: #5b6656;
    --paper: #f3f1e8;
    --rule: #d9d5c3;
    --green: #2f5d34;
    --deep: #1f3d23;
    --ochre: #c58a2b;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--text); }
  a { color: inherit; }
  .proposal-bar {
    background: #f1e7d0; color: #3b2f17; font-size: 13px; line-height: 1.4; padding: 8px 16px; text-align: center;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px;
    background: var(--deep); color: var(--paper);
  }
  .wordmark { font: 600 19px/1.2 var(--display); }
  .call-small {
    flex: none; background: var(--ochre); color: var(--deep); text-decoration: none; font-weight: 700;
    font-size: 15px; padding: 9px 14px; border-radius: 6px;
  }
  .hero { padding: 44px 20px 40px; background: var(--deep); color: var(--paper); }
  .eyebrow { margin: 0 0 14px; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: #cbd5c2; }
  h1 { margin: 0; font: 600 clamp(44px, 12.5vw, 86px)/1.02 var(--display); letter-spacing: -0.015em; text-wrap: balance; }
  .area { margin: 18px 0 0; font-size: 19px; color: #dfe5d7; }
  .actions { display: grid; gap: 12px; margin-top: 30px; max-width: 400px; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 19px;
    padding: 16px 18px; border-radius: 8px;
  }
  .btn-call { background: var(--ochre); color: var(--deep); }
  /* Mowing stripes, drawn rather than photographed. */
  .stripes {
    height: 28px;
    background: repeating-linear-gradient(90deg, #3d7443 0 36px, #2f5d34 36px 72px);
  }
  section { padding: 40px 20px; border-bottom: 1px solid var(--rule); }
  h2 { margin: 0 0 18px; font: 600 24px/1.2 var(--display); }
  .proof { display: flex; flex-wrap: wrap; gap: 8px 40px; }
  .proof b { display: block; font: 600 clamp(74px, 21vw, 118px)/0.95 var(--display); color: var(--green); }
  .proof span { display: block; margin-top: 6px; color: var(--muted); }
  .hours { margin: 0; padding: 0; list-style: none; font-size: 18px; }
  .hours li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .hours li:first-child { border-top: 0; }
  .hours-note { margin: 14px 0 0; color: var(--muted); }
  .empty { margin: 0; color: var(--muted); font-style: italic; }
  .contact p { margin: 0 0 16px; font: 400 22px/1.4 var(--display); }
  .contact .btn-call { max-width: 400px; }
  .btn-map { border: 2px solid var(--paper); color: var(--paper); }
  address { font-style: normal; font: 400 22px/1.4 var(--display); }
  .visit a:not(.btn) { display: inline-block; margin-top: 14px; font-weight: 700; }
  footer { padding: 28px 20px 40px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="proposal-bar" role="note">A proposal for ${name}, prepared by Mizan Group LLC. Not an official site.</div>
<header>
  <div class="wordmark">${display_name}</div>
  ${call_small}
</header>
<div class="hero">
  <p class="eyebrow">${trade}</p>
  <h1>${display_name}</h1>
  <p class="area">${area_line}</p>
  <div class="actions">
    ${call_button}
    ${map_button}
  </div>
</div>
<div class="stripes" aria-hidden="true"></div>
${proof}
<section aria-labelledby="hours-title">
  <h2 id="hours-title">Hours</h2>
  ${site_hours}
</section>
${contact_section}
<footer>&copy; ${year} ${display_name}</footer>
</body>
</html>
