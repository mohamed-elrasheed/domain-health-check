<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>${display_name} | ${trade} in ${town}</title>
<style>
  :root {
    --ink: #0f2a2e;
    --muted: #4f6668;
    --paper: #ffffff;
    --mist: #e8f4f1;
    --rule: #d7e7e3;
    --teal: #0f766e;
    --display: "Avenir Next", "Avenir", "Nunito", "Segoe UI", system-ui, sans-serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--text); }
  a { color: inherit; }
  .proposal-bar {
    background: #f1e7d0; color: #3b2f17; font-size: 13px; line-height: 1.4; padding: 8px 16px; text-align: center;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; }
  .wordmark { font: 700 18px/1.2 var(--display); letter-spacing: 0.01em; }
  .call-small {
    flex: none; background: var(--mist); color: var(--teal); text-decoration: none; font-weight: 700;
    font-size: 15px; padding: 9px 16px; border-radius: 999px;
  }
  .hero { margin: 0 12px; padding: 44px 20px 40px; border-radius: 28px; background: var(--mist); }
  .eyebrow { margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--teal); }
  h1 { margin: 0; font: 700 clamp(42px, 12vw, 80px)/1.02 var(--display); letter-spacing: -0.025em; text-wrap: balance; }
  .area { margin: 18px 0 0; font-size: 19px; color: var(--muted); }
  .actions { display: grid; gap: 12px; margin-top: 30px; max-width: 400px; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 19px;
    padding: 16px 18px; border-radius: 999px;
  }
  .btn-call { background: var(--teal); color: #fff; }
  section { padding: 40px 20px; border-bottom: 1px solid var(--rule); }
  h2 { margin: 0 0 18px; font: 700 22px/1.2 var(--display); letter-spacing: -0.01em; }
  .proof { display: flex; flex-wrap: wrap; gap: 8px 40px; }
  .proof b { display: block; font: 700 clamp(72px, 21vw, 116px)/0.95 var(--display); letter-spacing: -0.04em; color: var(--teal); }
  .proof span { display: block; margin-top: 6px; color: var(--muted); }
  .hours { margin: 0; padding: 0; list-style: none; font-size: 18px; }
  .hours li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .hours li:first-child { border-top: 0; }
  .hours-note { margin: 14px 0 0; color: var(--muted); }
  .empty { margin: 0; color: var(--muted); font-style: italic; }
  .contact p { margin: 0 0 8px; font-size: 19px; }
  .contact a:not(.btn) { font-weight: 700; color: var(--teal); }
  .btn-map { border: 2px solid var(--teal); color: var(--teal); }
  address { font-style: normal; font-size: 19px; line-height: 1.45; }
  .visit a:not(.btn) { display: inline-block; margin-top: 14px; }
  footer { padding: 28px 20px 40px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="proposal-bar" role="note">A proposal for ${name}, prepared by Mizan Group LLC. Not an official site.</div>
<header>
  <div class="wordmark">${display_name}</div>
  ${call_small}
</header>
<div class="hero">
  <p class="eyebrow">${trade}</p>
  <h1>${display_name}</h1>
  <p class="area">${area_line}</p>
  <div class="actions">
    ${call_button}
    ${map_button}
  </div>
</div>
${proof}
<section aria-labelledby="hours-title">
  <h2 id="hours-title">Hours</h2>
  ${site_hours}
</section>
${contact_section}
<footer>&copy; ${year} ${display_name}</footer>
</body>
</html>
