[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-health-check"
version = "0.1.0"
description = "Plain-English health reports for domains submitted through mizangroupllc.com/digital, built from public DNS and registry records plus a single page view."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dnspython>=2.4",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
domain-health-check = "domain_health_check.cli:main"

[tool.setuptools.packages.find]
include = ["domain_health_check*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
