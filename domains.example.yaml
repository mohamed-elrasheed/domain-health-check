# Copy this file to domains.yaml (which is gitignored) and put your real domains there.
# Never put real client domains in this example file: the repository is public.
#
# Each entry is either a plain domain name, or a mapping with:
#   name:            the domain to check
#   dkim_selectors:  the DKIM selectors this domain's email provider uses.
#                    If you leave this out, the tool tries common ones:
#                    google, fm1, fm2, fm3, selector1, selector2

domains:
  - name: example.com
    dkim_selectors: [google]          # Google Workspace

  - name: example.org
    dkim_selectors: [selector1, selector2]   # Microsoft 365

  - name: example.net
    dkim_selectors: [fm1, fm2, fm3]   # Fastmail

  - shop.example                      # plain entry: common selectors are tried
